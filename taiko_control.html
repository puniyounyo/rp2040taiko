<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>太鼓コントローラー設定 ＆ モニター</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #fff;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #005999; }
        button.danger { background: #d9534f; }
        button.danger:hover { background: #c9302c; }
        button.success { background: #4cae4c; }
        button.success:hover { background: #449d44; }
        
        .param-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .param-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        .param-item label {
            display: block;
            font-size: 13px;
            color: #bbb;
            margin-bottom: 5px;
        }
        .param-item input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
        }
        .param-val {
            font-weight: bold;
            color: #0ff;
            float: right;
        }
        
        #console-log {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: scroll;
            border-radius: 4px;
            border: 1px solid #333;
            font-size: 12px;
            white-space: pre-wrap;
        }
        
        /* 打撃ビジュアライザーのスタイル */
        .drum-monitor {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .sensor-box {
            width: 80px;
            height: 130px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            transition: background 0.08s, transform 0.08s;
        }
        .sensor-box.face {
            border-radius: 50px;
            width: 100px;
        }
        .sensor-title { font-size: 12px; font-weight: bold; color: #ccc; }
        .hit-count { font-size: 22px; font-weight: bold; color: #ff3333; }
        .key-label { font-size: 11px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <h1>太鼓コントローラー 設定 ＆ モニター</h1>

    <!-- 接続パネル -->
    <div class="card">
        <h2>デバイス接続</h2>
        <button id="connect-btn" class="success">シリアルポート接続</button>
        <button id="disconnect-btn" class="danger" disabled>切断</button>
        <span id="connection-status" style="margin-left: 15px; font-weight: bold; color: #f0ad4e;">未接続</span>
    </div>

    <!-- リアルタイム打撃ビジュアライザー ＆ カウンター -->
    <div class="card" style="text-align: center;">
        <h2>打撃判定モニター ＆ カウンター</h2>
        <div class="drum-monitor">
            <!-- L_EDGE (0) -->
            <div id="sensor-box-0" class="sensor-box">
                <span class="sensor-title">L-EDGE</span>
                <span id="count-0" class="hit-count" style="color: #0ff;">0</span>
                <span class="key-label">[D]</span>
            </div>
            <!-- L_FACE (1) -->
            <div id="sensor-box-1" class="sensor-box face">
                <span class="sensor-title">L-FACE</span>
                <span id="count-1" class="hit-count">0</span>
                <span class="key-label">[F]</span>
            </div>
            <!-- R_FACE (2) -->
            <div id="sensor-box-2" class="sensor-box face">
                <span class="sensor-title">R-FACE</span>
                <span id="count-2" class="hit-count">0</span>
                <span class="key-label">[J]</span>
            </div>
            <!-- R_EDGE (3) -->
            <div id="sensor-box-3" class="sensor-box">
                <span class="sensor-title">R-EDGE</span>
                <span id="count-3" class="hit-count" style="color: #0ff;">0</span>
                <span class="key-label">[K]</span>
            </div>
        </div>
        <button id="reset-counter-btn" class="danger">カウンターリセット</button>
    </div>

    <!-- パラメータ調整パネル -->
    <div class="card">
        <h2>パラメータ設定 (12項目)</h2>
        <div style="margin-bottom: 15px;">
            <button id="get-btn">設定を読み込む (GETS)</button>
            <button id="save-btn" class="success">EEPROMに保存 (SAVE)</button>
        </div>
        <div class="param-grid" id="param-grid">
            <!-- 動的にスライダーが生成されます -->
        </div>
    </div>

    <!-- ログ・デバッグパネル -->
    <div class="card">
        <h2>シリアルログ</h2>
        <button id="raw-toggle-btn">RAW波形モニター 開始</button>
        <div id="console-log"></div>
    </div>
</div>

<script>
    let port;
    let reader;
    let inputDone;
    let inputStream;
    let outputStream;
    let writer;
    let isReading = false;
    let rawActive = false;

    // 12項目のパラメータ名定義
    const kandoNames = [
        "L_EDGE", "L_FACE", "R_FACE", "R_EDGE", "FACE_INTV",
        "EDGE_INTV", "CROSS_IG", "HOLD_MS", "FACE_SGL", "EDGE_SGL",
        "FACE_LR", "EDGE_LR"
    ];
    let kandoValues = new Array(12).fill(0);
    let hitCounts = [0, 0, 0, 0];

    // スライダーUIの動的生成
    const paramGrid = document.getElementById('param-grid');
    for (let i = 0; i < 12; i++) {
        const div = document.createElement('div');
        div.className = 'param-item';
        div.innerHTML = `
            <label>${i}: ${kandoNames[i]} <span id="val-${i}" class="param-val">0</span></label>
            <input type="range" id="slider-${i}" min="0" max="255" value="0">
        `;
        paramGrid.appendChild(div);

        const slider = document.getElementById(`slider-${i}`);
        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById(`val-${i}`).innerText = val;
            kandoValues[i] = parseInt(val);
            sendSensCommand();
        });
    }

    // ログ出力関数
    function logMessage(msg) {
        const consoleDiv = document.getElementById('console-log');
        consoleDiv.innerText += msg + "\n";
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // カウンターリセット
    document.getElementById('reset-counter-btn').addEventListener('click', () => {
        hitCounts = [0, 0, 0, 0];
        for (let i = 0; i < 4; i++) {
            document.getElementById(`count-${i}`).innerText = '0';
        }
        logMessage("[UI] Counter reset.");
    });

    // センサーヒット時の演出
    function triggerSensorHit(ch) {
        if (ch < 0 || ch > 3) return;
        hitCounts[ch]++;
        document.getElementById(`count-${ch}`).innerText = hitCounts[ch];

        const box = document.getElementById(`sensor-box-${ch}`);
        box.style.background = (ch === 1 || ch === 2) ? '#ffcc00' : '#00ffff';
        box.style.transform = 'scale(1.08)';

        setTimeout(() => {
            box.style.background = '#2a2a2a';
            box.style.transform = 'scale(1)';
        }, 80);
    }

    // シリアル接続
    document.getElementById('connect-btn').addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });

            document.getElementById('connect-btn').disabled = true;
            document.getElementById('disconnect-btn').disabled = false;
            document.getElementById('connection-status').innerText = "接続成功";
            document.getElementById('connection-status').style.color = "#5cb85c";
            logMessage("[INFO] Serial connected.");

            isReading = true;
            readLoop();

            // 接続時に自動で設定を読み込む
            setTimeout(() => sendCommand("GETS\n"), 500);
        } catch (err) {
            logMessage("[ERROR] " + err);
        }
    });

    // シリアル切断
    document.getElementById('disconnect-btn').addEventListener('click', async () => {
        isReading = false;
        rawActive = false;
        if (reader) {
            await reader.cancel();
            await inputDone.catch(() => {});
        }
        if (port) {
            await port.close();
        }
        document.getElementById('connect-btn').disabled = false;
        document.getElementById('disconnect-btn').disabled = true;
        document.getElementById('connection-status').innerText = "未接続";
        document.getElementById('connection-status').style.color = "#f0ad4e";
        logMessage("[INFO] Serial disconnected.");
    });

    // コマンド送信
    async function sendCommand(cmd) {
        if (!port || !port.writable) return;
        const writer = port.writable.getWriter();
        await writer.write(new TextEncoder().encode(cmd));
        writer.releaseLock();
    }

    // SENSコマンド構築・送信
    function sendSensCommand() {
        let cmd = "SENS:";
        for (let i = 0; i < 12; i++) {
            cmd += `${i}=${kandoValues[i]}:`;
        }
        cmd += "\n";
        sendCommand(cmd);
    }

    document.getElementById('get-btn').addEventListener('click', () => sendCommand("GETS\n"));
    document.getElementById('save-btn').addEventListener('click', () => sendCommand("SAVE\n"));

    // RAW波形トグル
    document.getElementById('raw-toggle-btn').addEventListener('click', () => {
        rawActive = !rawActive;
        if (rawActive) {
            sendCommand("RAWON\n");
            document.getElementById('raw-toggle-btn').innerText = "RAW波形モニター 停止";
            document.getElementById('raw-toggle-btn').style.background = "#d9534f";
        } else {
            sendCommand("RAWOFF\n");
            document.getElementById('raw-toggle-btn').innerText = "RAW波形モニター 開始";
            document.getElementById('raw-toggle-btn').style.background = "#007acc";
        }
    });

    // 受信ループ
    async function readLoop() {
        const textDecoder = new TextDecoderStream();
        inputDone = port.readable.pipeTo(textDecoder.writable);
        inputStream = textDecoder.readable;
        reader = inputStream.getReader();

        let buffer = "";
        try {
            while (isReading) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                    buffer += value;
                    let lines = buffer.split("\n");
                    buffer = lines.pop(); // 最後の不完全な行を保持

                    for (let line of lines) {
                        line = line.trim();
                        if (!line) continue;

                        // 通常ログ表示（RAWデータ以外、または必要に応じて）
                        if (!line.startsWith("RAW:")) {
                            logMessage(line);
                        }

                        // GETSの応答解析 (例: "0 [L_EDGE]: 80")
                        if (line.includes('[') && line.includes(']:')) {
                            let parts = line.split(':');
                            let idxMatch = parts[0].match(/(\d+)/);
                            if (idxMatch) {
                                let idx = parseInt(idxMatch[1]);
                                let val = parseInt(parts[1].trim());
                                if (idx >= 0 && idx < 12) {
                                    kandoValues[idx] = val;
                                    document.getElementById(`slider-${idx}`).value = val;
                                    document.getElementById(`val-${idx}`).innerText = val;
                                }
                            }
                        }

                        // ファームウェア側から "HIT:ch" が飛んできた場合や、
                        // もしRAWデータで閾値を超えた瞬間をビジュアルに反映させたい場合の処理
                        if (line.startsWith("RAW:")) {
                            let rawParts = line.substring(4).split(',');
                            if (rawParts.length === 4) {
                                for (let i = 0; i < 4; i++) {
                                    let deltaVal = parseInt(rawParts[i]);
                                    // 閾値を超えて跳ね上がった瞬間を検出してビジュアルを光らせる
                                    if (deltaVal > kandoValues[i]) {
                                        triggerSensorHit(i);
                                    }
                                }
                            }
                        }
                    }
                }
            }
        } catch (error) {
            logMessage("[ERROR] Read error: " + error);
        } finally {
            reader.releaseLock();
        }
    }
</script>
</body>
</html>
