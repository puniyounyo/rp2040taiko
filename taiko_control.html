<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Taiko Controller Configurator & Monitor</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --text-color: #e1e1e6;
            --accent-color: #00b4d8;
            --accent-hover: #90e0ef;
            --border-color: #2a2a35;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
            height: 50px;
        }
        h1 { font-size: 1.2rem; color: var(--accent-color); }
        .controls-top { display: flex; gap: 10px; align-items: center; }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        button:hover { background-color: var(--accent-hover); }
        button.secondary { background-color: #3a3a48; color: var(--text-color); }
        button.secondary:hover { background-color: #4a4a58; }

        /* 1920x1080 1画面収容用 2カラムレイアウト */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            overflow: hidden;
            padding-bottom: 5px;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel h2 {
            font-size: 1rem;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            color: var(--accent-hover);
        }
        
        /* 15項目スライダーエリア（スクロール可能） */
        .params-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .param-row label { flex: 1; font-weight: 500; }
        .param-row input[type="range"] { flex: 1; margin: 0 10px; accent-color: var(--accent-color); }
        .param-row span { width: 40px; text-align: right; font-family: monospace; }

        /* 右側モニターエリア */
        .monitor-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }
        canvas {
            width: 100%;
            height: 220px;
            background-color: #0b0b0e;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .log-box {
            background-color: #0b0b0e;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            height: 140px;
            overflow-y: auto;
            color: #a9a9b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Taiko Controller Configurator (15 Params)</h1>
        <div class="controls-top">
            <span id="connection-status" style="font-size: 0.85rem; color: #ff6b6b;">Disconnected</span>
            <button id="connect-btn">Connect Serial</button>
            <button class="secondary" id="read-btn">Read EEPROM</button>
            <button id="save-btn">Save to EEPROM</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 左パネル：15項目パラメータ調整 -->
        <div class="panel">
            <h2>Parameters (kando 0 ~ 14)</h2>
            <div class="params-grid" id="params-container">
                <!-- 動的生成 -->
            </div>
        </div>

        <!-- 右パネル：リアルタイムモニター & ログ -->
        <div class="panel">
            <h2>Realtime Delta Monitor & Log</h2>
            <div class="monitor-content">
                <div style="display: flex; gap: 10px; margin-bottom: 4px;">
                    <button class="secondary" id="raw-on-btn">RAW Start</button>
                    <button class="secondary" id="raw-off-btn">RAW Stop</button>
                </div>
                <canvas id="waveCanvas"></canvas>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        const kandoNames = [
            "L_EDGE", "L_FACE", "R_FACE", "R_EDGE", "FACE_INTV",
            "EDGE_INTV", "CROSS_IG", "HOLD_MS", "FACE_SGL", "EDGE_SGL",
            "HOLD_T", "SPLIT_M", "PID_SEL", "LED_BRI", "KEY_CFG"
        ];
        
        let kandoValues = new Array(15).fill(0);
        let port, reader, writer, inputStreamClosed;
        let reading = false;
        let rawActive = false;

        // パラメータスライダーの動的生成
        const container = document.getElementById('params-container');
        kandoNames.forEach((name, index) => {
            const row = document.createElement('div');
            row.className = 'param-row';
            row.innerHTML = `
                <label>[${index}] ${name}</label>
                <input type="range" id="param-${index}" min="0" max="255" value="0">
                <span id="val-${index}">0</span>
            `;
            container.appendChild(row);

            const slider = document.getElementById(`param-${index}`);
            const valSpan = document.getElementById(`val-${index}`);
            slider.addEventListener('input', (e) => {
                kandoValues[index] = parseInt(e.target.value);
                valSpan.textContent = kandoValues[index];
            });
        });

        function updateUIValues() {
            kandoNames.forEach((_, index) => {
                const slider = document.getElementById(`param-${index}`);
                const valSpan = document.getElementById(`val-${index}`);
                slider.value = kandoValues[index];
                valSpan.textContent = kandoValues[index];
            });
        }

        // シリアル接続
        document.getElementById('connect-btn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById('connection-status').textContent = "Connected";
                document.getElementById('connection-status').style.color = "#51cf66";
                readLoop();
            } catch (err) {
                console.error(err);
            }
        });

        async function sendCommand(cmd) {
            if (!port) return;
            const encoder = new TextEncoder();
            writer = port.writable.getWriter();
            await writer.write(encoder.encode(cmd + "\n"));
            writer.releaseLock();
        }

        document.getElementById('read-btn').addEventListener('click', () => sendCommand("GETS"));
        document.getElementById('save-btn').addEventListener('click', () => sendCommand("SAVE"));
        document.getElementById('raw-on-btn').addEventListener('click', () => { rawActive = true; sendCommand("RAWON"); });
        document.getElementById('raw-off-btn').addEventListener('click', () => { rawActive = false; sendCommand("RAWOFF"); });

        // グラフ描画用バッファ
        let waveData = [[], [], [], []];
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        function drawWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const colors = ['#ff6b6b', '#ff922b', '#51cf66', '#339af0'];
            
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.strokeStyle = colors[i];
                ctx.lineWidth = 1.5;
                const len = waveData[i].length;
                for (let x = 0; x < len; x++) {
                    const py = canvas.height - (waveData[i][x] / 400.0) * canvas.height; // スケール調整
                    if (x === 0) ctx.moveTo(x * (canvas.width / 100), py);
                    else ctx.lineTo(x * (canvas.width / 100), py);
                }
                ctx.stroke();
            }
            requestAnimationFrame(drawWave);
        }
        drawWave();

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            inputStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); // 未完了の行を残す

                    for (let line of lines) {
                        line = line.trim();
                        appendLog(line);

                        // GETSの応答解析 (例: "0:80")
                        if (line.includes(':') && !line.startsWith("RAW") && !line.startsWith("HIT")) {
                            let parts = line.split(':');
                            let idx = parseInt(parts[0]);
                            let val = parseInt(parts[1]);
                            if (!isNaN(idx) && !isNaN(val) && idx < 15) {
                                kandoValues[idx] = val;
                                updateUIValues();
                            }
                        }

                        // RAWデータ解析 (例: "RAW:10,50,2,15")
                        if (line.startsWith("RAW:")) {
                            let vals = line.substring(4).split(',').map(Number);
                            for (let i = 0; i < 4; i++) {
                                waveData[i].push(vals[i] || 0);
                                if (waveData[i].length > 100) waveData[i].shift();
                            }
                        }
                    }
                }
            } catch (err) {
                console.error(err);
            } finally {
                reader.releaseLock();
            }
        }

        function appendLog(text) {
            const box = document.getElementById('log-box');
            box.innerHTML += text + "<br>";
            box.scrollTop = box.scrollHeight;
            if (box.childNodes.length > 100) box.firstChild.remove();
        }

        // キャンバスサイズ自動フィット
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
