<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>太鼓コントローラー 設定 ＆ モニター (v0.9)</title>
<style>
  body { font-family: sans-serif; background:#121212; color:#e0e0e0; margin:0; padding:10px 20px; box-sizing:border-box; }
  h1 { font-size: 20px; margin: 0 0 4px; color:#fff; border-bottom:2px solid #333; padding-bottom:4px; }
  h2 { font-size: 15px; margin: 0 0 6px; color:#fff; }
  .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .card { background:#1e1e1e; border:1px solid #333; border-radius:6px; padding:10px 14px; box-shadow:0 2px 4px rgba(0,0,0,.3); }
  
  button { background:#007acc; color:#fff; border:none; padding:6px 12px; font-size:13px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:6px; transition:background .2s; }
  button:hover { background:#005999; }
  button:disabled { background:#444; cursor:default; }
  button.danger { background:#d9534f; } button.danger:hover { background:#c9302c; }
  button.success { background:#4cae4c; } button.success:hover { background:#449d44; }
  button.dirty { background:#e67e22; }
  .note { font-size:11px; color:#999; margin:2px 0 6px; }

  /* デバイス接続・上部コンパクト化 */
  .top-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* 打撃モニター */
  .drum-monitor { display:flex; justify-content:center; gap:20px; margin:6px 0; }
  .sensor-col { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bar-wrap { position:relative; width:28px; height:120px; background:#222; border:1px solid #555; border-radius:4px; overflow:hidden; }
  .bar-fill { position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(to top,#00b7ff,#00ffd5); }
  .bar-fill.over { background:linear-gradient(to top,#ff8800,#ffe600); }
  .bar-th { position:absolute; left:0; right:0; height:2px; background:#ff3333; bottom:0; }
  .bar-val { font-size:11px; color:#0ff; height:12px; }
  .sensor-box { width:70px; height:75px; background:#2a2a2a; border:2px solid #555; border-radius:8px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; padding:6px; transition:background .08s, transform .08s; }
  .sensor-box.face { border-radius:35px; width:82px; }
  .sensor-title { font-size:11px; font-weight:bold; color:#ccc; }
  .hit-count { font-size:18px; font-weight:bold; color:#ff3333; }
  .key-label { font-size:10px; color:#888; }
  .strength { font-size:10px; color:#aaa; height:12px; }

  /* パラメータ 3カラム配置でフルHD収容 */
  .param-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-top:8px; }
  .param-item { background:#2a2a2a; padding:8px 10px; border-radius:5px; border:1px solid #444; }
  .param-item.changed { border-color:#e67e22; }
  .param-item .name { font-size:12px; color:#ddd; font-weight:bold; }
  .param-item .desc { font-size:10px; color:#999; margin:1px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .param-row { display:flex; align-items:center; gap:6px; }
  .param-row input[type=range] { flex:1; height: 6px; }
  .param-row input[type=number] { width:52px; background:#111; color:#0ff; border:1px solid #555; border-radius:4px; padding:2px 4px; font-size:12px; font-weight:bold; text-align:right; }
  .param-row button.step { margin:0; padding:1px 6px; font-size:12px; background:#444; }

  #console-log { background:#000; color:#0f0; font-family:monospace; padding:6px 10px; height:70px; overflow-y:scroll; border-radius:4px; border:1px solid #333; font-size:11px; white-space:pre-wrap; }
  
  .monitor-controls { display: flex; justify-content: center; gap: 10px; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>太鼓コントローラー 設定 ＆ モニター <small style="font-size:12px;color:#888;">v0.9</small></h1>

  <!-- デバイス接続 -->
  <div class="card" style="padding: 8px 14px;">
    <div class="top-row">
      <h2>デバイス接続</h2>
      <button id="connect-btn" class="success" style="margin:0;">シリアルポート接続</button>
      <button id="disconnect-btn" class="danger" disabled style="margin:0;">切断</button>
      <span id="connection-status" style="font-weight:bold;color:#f0ad4e;">未接続</span>
      <span class="note" style="margin:0 0 0 auto;">※PCモードでのみ有効</span>
    </div>
  </div>

  <!-- 打撃モニター -->
  <div class="card" style="text-align:center;">
    <h2>打撃判定モニター ＆ 信号強度</h2>
    <div class="note">縦バー＝叩いた強さ(ピーク保持)。赤線＝しきい値。</div>
    <div class="drum-monitor" id="drum-monitor"></div>
    <div class="monitor-controls">
      <button id="reset-counter-btn" class="danger" style="margin:0;">カウンターリセット</button>
      <button id="raw-toggle-btn" style="margin:0;">強度(RAW)モニター 停止</button>
    </div>
  </div>

  <!-- パラメータ設定 -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <h2>パラメータ設定 (12項目)</h2>
      <div>
        <button id="get-btn" style="margin:0 4px 0 0;">読み込み (GETS)</button>
        <button id="save-btn" class="success" style="margin:0;">EEPROM保存 (SAVE)</button>
        <span id="dirty-label" style="color:#e67e22;font-weight:bold; margin-left:10px; font-size:12px;"></span>
      </div>
    </div>
    <div class="param-grid" id="param-grid"></div>
  </div>

  <!-- シリアルログ -->
  <div class="card" style="padding: 8px 14px;">
    <h2>シリアルログ</h2>
    <div id="console-log"></div>
  </div>
</div>

<script>
  // ---------- 定義 ----------
  const PARAMS = [
    { name:"D_L-EDGE",  desc:"左縁(カッ) 感度しきい値" },
    { name:"F_L-FACE",  desc:"左面(ドン) 感度しきい値" },
    { name:"J_R-FACE",  desc:"右面(ドン) 感度しきい値" },
    { name:"K_R-EDGE",  desc:"右縁(カッ) 感度しきい値" },
    { name:"FACE_INTV", desc:"面→面の最小間隔 (ms)" },
    { name:"EDGE_INTV", desc:"縁→縁の最小間隔 (ms)" },
    { name:"CROSS_IG",  desc:"面⇔縁 相互無視時間 (ms)" },
    { name:"HOLD_MS",   desc:"ボタン/キー保持時間 (ms)" },
    { name:"FACE_SGL",  desc:"同じ面センサーの再入力間隔 (ms)" },
    { name:"EDGE_SGL",  desc:"同じ縁センサーの再入力間隔 (ms)" },
    { name:"FACE_LR",   desc:"左面⇔右面 追加遅延 (ms)" },
    { name:"EDGE_LR",   desc:"左縁⇔右縁 追加遅延 (ms)" },
  ];
  const N = PARAMS.length;
  const SENSORS = [
    { title:"L-EDGE", key:"D", face:false },
    { title:"L-FACE", key:"F", face:true  },
    { title:"R-FACE", key:"J", face:true  },
    { title:"R-EDGE", key:"K", face:false },
  ];

  let port, reader, inputDone;
  let isReading = false;
  let rawActive = false;
  let values = new Array(N).fill(0);       
  let deviceValues = new Array(N).fill(0); 
  let dirty = false;

  // ---------- ログ ----------
  const logLines = [];
  let logTimer = null;
  function logMessage(msg) {
    logLines.push(msg);
    if (logLines.length > 200) logLines.shift();
    if (!logTimer) logTimer = setTimeout(() => {
      logTimer = null;
      const el = document.getElementById('console-log');
      el.textContent = logLines.join("\n");
      el.scrollTop = el.scrollHeight;
    }, 150);
  }

  // ---------- 打撃モニターの生成 ----------
  const monitor = document.getElementById('drum-monitor');
  const ui = [];
  SENSORS.forEach((s, i) => {
    const col = document.createElement('div');
    col.className = 'sensor-col';
    col.innerHTML = `
      <div class="bar-val" id="bval-${i}">0</div>
      <div class="bar-wrap"><div class="bar-fill" id="bfill-${i}"></div><div class="bar-th" id="bth-${i}"></div></div>
      <div id="box-${i}" class="sensor-box ${s.face ? 'face' : ''}">
        <span class="sensor-title">${s.title}</span>
        <span id="count-${i}" class="hit-count" style="${s.face ? '' : 'color:#0ff;'}">0</span>
        <span class="key-label">[${s.key}]</span>
      </div>
      <div class="strength" id="str-${i}">強度: -</div>`;
    monitor.appendChild(col);
    ui.push({
      fill: col.querySelector(`#bfill-${i}`), th: col.querySelector(`#bth-${i}`),
      val: col.querySelector(`#bval-${i}`), box: col.querySelector(`#box-${i}`),
      count: col.querySelector(`#count-${i}`), str: col.querySelector(`#str-${i}`),
    });
  });

  let hitCounts = [0, 0, 0, 0];
  let peakHold = [0, 0, 0, 0];     
  let peakHoldAt = [0, 0, 0, 0];
  let pendingHitAt = [0, 0, 0, 0]; 
  let lastStrength = [0, 0, 0, 0];
  let scaleMax = 300;              

  function onHit(ch) {
    if (ch < 0 || ch > 3) return;
    hitCounts[ch]++;
    ui[ch].count.textContent = hitCounts[ch];
    pendingHitAt[ch] = performance.now();
    lastStrength[ch] = 0;
    const box = ui[ch].box;
    box.style.background = SENSORS[ch].face ? '#ffcc00' : '#00ffff';
    box.style.transform = 'scale(1.05)';
    setTimeout(() => { box.style.background = '#2a2a2a'; box.style.transform = 'scale(1)'; }, 80);
  }

  function onRaw(peaks) {
    const now = performance.now();
    for (let i = 0; i < 4; i++) {
      const v = peaks[i];
      if (v >= peakHold[i]) { peakHold[i] = v; peakHoldAt[i] = now; }
      if (v > scaleMax * 0.95) scaleMax = v * 1.15;
      if (now - pendingHitAt[i] < 200 && v > lastStrength[i]) {
        lastStrength[i] = v;
        ui[i].str.textContent = '強度: ' + v;
      }
    }
  }

  function frame() {
    const now = performance.now();
    scaleMax = Math.max(300, scaleMax * 0.998);
    for (let i = 0; i < 4; i++) {
      if (now - peakHoldAt[i] > 250) peakHold[i] *= 0.9; 
      const h = Math.min(100, (peakHold[i] / scaleMax) * 100);
      ui[i].fill.style.height = h + '%';
      ui[i].fill.classList.toggle('over', peakHold[i] > values[i]);
      ui[i].th.style.bottom = Math.min(100, (values[i] / scaleMax) * 100) + '%';
      ui[i].val.textContent = Math.round(peakHold[i]);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('reset-counter-btn').addEventListener('click', () => {
    hitCounts = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) { ui[i].count.textContent = '0'; ui[i].str.textContent = '強度: -'; }
    logMessage("[UI] Counter reset.");
  });

  // ---------- パラメータUI ----------
  const grid = document.getElementById('param-grid');
  const sliders = [], numbers = [], items = [];
  const clamp = v => Math.max(0, Math.min(255, Math.round(Number(v) || 0)));

  PARAMS.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'param-item';
    div.innerHTML = `
      <div class="name">${i}: ${p.name}</div>
      <div class="desc" title="${p.desc}">${p.desc}</div>
      <div class="param-row">
        <button class="step" data-d="-1">－</button>
        <input type="range" min="0" max="255" value="0">
        <button class="step" data-d="1">＋</button>
        <input type="number" min="0" max="255" value="0">
      </div>`;
    grid.appendChild(div);
    const slider = div.querySelector('input[type=range]');
    const number = div.querySelector('input[type=number]');
    sliders.push(slider); numbers.push(number); items.push(div);

    slider.addEventListener('input', () => setValue(i, slider.value, false));
    slider.addEventListener('change', () => setValue(i, slider.value, true));
    number.addEventListener('change', () => setValue(i, number.value, true));
    number.addEventListener('keydown', e => { if (e.key === 'Enter') number.blur(); });
    div.querySelectorAll('.step').forEach(b =>
      b.addEventListener('click', () => setValue(i, values[i] + Number(b.dataset.d), true)));
  });

  const sendTimers = {};
  function setValue(i, v, immediate) {
    v = clamp(v);
    values[i] = v;
    sliders[i].value = v;
    numbers[i].value = v;
    refreshDirty();
    if (immediate) {
      clearTimeout(sendTimers[i]);
      sendSens(i);
    } else if (!sendTimers[i]) {
      sendTimers[i] = setTimeout(() => { sendTimers[i] = null; sendSens(i); }, 120);
    }
  }

  function sendSens(i) { sendCommand(`SENS:${i}=${values[i]}:\n`); }

  function refreshDirty() {
    dirty = values.some((v, i) => v !== deviceValues[i]);
    items.forEach((d, i) => d.classList.toggle('changed', values[i] !== deviceValues[i]));
    document.getElementById('save-btn').classList.toggle('dirty', dirty);
    document.getElementById('dirty-label').textContent = dirty ? '● 未保存の変更あり' : '';
  }

  // ---------- シリアル ----------
  let writeChain = Promise.resolve();
  function sendCommand(cmd) {
    if (!port || !port.writable) return;
    writeChain = writeChain.then(async () => {
      const w = port.writable.getWriter();
      try { await w.write(new TextEncoder().encode(cmd)); } finally { w.releaseLock(); }
    }).catch(e => logMessage("[ERROR] write: " + e));
  }

  function setRaw(on) {
    rawActive = on;
    sendCommand(on ? "RAWON\n" : "RAWOFF\n");
    const b = document.getElementById('raw-toggle-btn');
    b.textContent = on ? "強度(RAW)モニター 停止" : "強度(RAW)モニター 開始";
    b.style.background = on ? "#d9534f" : "#007acc";
  }
  document.getElementById('raw-toggle-btn').addEventListener('click', () => setRaw(!rawActive));
  document.getElementById('get-btn').addEventListener('click', () => sendCommand("GETS\n"));
  document.getElementById('save-btn').addEventListener('click', () => sendCommand("SAVE\n"));

  document.getElementById('connect-btn').addEventListener('click', async () => {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      document.getElementById('connect-btn').disabled = true;
      document.getElementById('disconnect-btn').disabled = false;
      document.getElementById('connection-status').textContent = "接続成功";
      document.getElementById('connection-status').style.color = "#5cb85c";
      logMessage("[INFO] Serial connected.");
      isReading = true;
      readLoop();
      setTimeout(() => sendCommand("GETS\n"), 500);
      setTimeout(() => setRaw(true), 900);   
    } catch (err) { logMessage("[ERROR] " + err); }
  });

  document.getElementById('disconnect-btn').addEventListener('click', async () => {
    isReading = false;
    if (rawActive) { try { setRaw(false); await writeChain; } catch (e) {} }
    try { if (reader) { await reader.cancel(); await inputDone.catch(() => {}); } } catch (e) {}
    try { if (port) await port.close(); } catch (e) {}
    port = null;
    document.getElementById('connect-btn').disabled = false;
    document.getElementById('disconnect-btn').disabled = true;
    document.getElementById('connection-status').textContent = "未接続";
    document.getElementById('connection-status').style.color = "#f0ad4e";
    logMessage("[INFO] Serial disconnected.");
  });

  function handleLine(line) {
    if (line.startsWith("HIT:")) { onHit(parseInt(line.substring(4))); return; }
    if (line.startsWith("RAW:")) {
      const parts = line.substring(4).split(',').map(Number);
      if (parts.length === 4 && parts.every(n => !isNaN(n))) onRaw(parts);
      return;
    }
    const m = line.match(/^(\d+)\s*\[[^\]]*\]:\s*(\d+)\s*$/);
    if (m) {
      const idx = parseInt(m[1]), val = parseInt(m[2]);
      if (idx >= 0 && idx < N) {
        values[idx] = deviceValues[idx] = val;
        sliders[idx].value = val; numbers[idx].value = val;
        refreshDirty();
      }
      return;
    }
    if (line === "OK:SENS") return;           
    if (line === "OK:SAVE") {
      deviceValues = values.slice(); refreshDirty();
      logMessage("[OK] EEPROMに保存しました");
      return;
    }
    if (line === "RAW_START" || line === "RAW_STOP") return;
    logMessage(line);
  }

  async function readLoop() {
    const decoder = new TextDecoderStream();
    inputDone = port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();
    let buffer = "";
    try {
      while (isReading) {
        const { value, done } = await reader.read();
        if (done) break;
        if (!value) continue;
        buffer += value;
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (let line of lines) {
          line = line.trim();
          if (line) handleLine(line);
        }
      }
    } catch (error) {
      logMessage("[ERROR] Read error: " + error);
    } finally {
      try { reader.releaseLock(); } catch (e) {}
    }
  }
</script>
</body>
</html>
