<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>RP2040 Taiko Controller Config</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ff5722;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .panel h2 {
            font-size: 18px;
            color: #ffa726;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-top: 0;
        }
        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #e64a19; }
        button.secondary { background-color: #37474f; }
        button.secondary:hover { background-color: #455a64; }
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 4px;
        }
        .param-row label {
            font-size: 13px;
            flex: 1;
        }
        .param-row input[type="range"] {
            flex: 1;
            margin: 0 10px;
        }
        .param-row span {
            width: 45px;
            text-align: right;
            font-family: monospace;
            font-size: 14px;
            color: #4db6ac;
        }
        canvas {
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .status-box {
            font-family: monospace;
            font-size: 13px;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            color: #81c784;
            margin-top: 10px;
            height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h1>RP2040 12-Parameter Taiko Controller Config</h1>

    <div class="container">
        <!-- 列1: 接続・コントロール -->
        <div class="panel">
            <h2>接続・管理</h2>
            <button id="connectBtn">シリアルポート接続</button>
            <button id="getBtn" class="secondary">設定を読み込む (GETS)</button>
            <button id="saveBtn" class="secondary">EEPROMに保存 (SAVE)</button>
            
            <h2 style="margin-top: 30px;">リアルタイム波形モニター</h2>
            <button id="rawBtn" class="secondary">RAW波形取得 開始/停止</button>
            <div id="status" class="status-box">未接続</div>
        </div>

        <!-- 列2: 12項目パラメータ設定 -->
        <div class="panel">
            <h2>精鋭12パラメータ調整</h2>
            <div id="paramsContainer"></div>
            <button id="sendBtn" style="margin-top: 15px;">設定を反映 (SENS)</button>
        </div>

        <!-- 列3: ライブ波形ビジュアライザ -->
        <div class="panel">
            <h2>センサー入力波形</h2>
            <canvas id="waveCanvas"></canvas>
            <p style="font-size: 12px; color: #aaa; text-align: center; margin-top: 10px;">
                緑: L_EDGE | 青: L_FACE | 赤: R_FACE | 黄: R_EDGE
            </p>
        </div>
    </div>

<script>
    const paramNames = [
        "L_EDGE (左縁感度)",
        "L_FACE (左面感度)",
        "R_FACE (右面感度)",
        "R_EDGE (右縁感度)",
        "FACE_INTV (面受付間隔 B)",
        "EDGE_INTV (縁受付間隔 C)",
        "CROSS_IG (異系統ガード D)",
        "HOLD_MS (入力保持時間 H)",
        "FACE_SGL (面単体受付 A)",
        "EDGE_SGL (縁単体受付 A_ed)",
        "FACE_LR (左右面干渉ガード)",
        "EDGE_LR (左右縁干渉ガード)"
    ];

    let currentValues = new Array(12).fill(0);
    let port, reader, writer;
    let keepReading = false;
    let rawActive = false;

    // パラメータスライダーの動的生成
    const container = document.getElementById('paramsContainer');
    paramNames.forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'param-row';
        div.innerHTML = `
            <label>${name}</label>
            <input type="range" id="p${i}" min="0" max="500" value="0" oninput="updateVal(${i})">
            <span id="v${i}">0</span>
        `;
        container.appendChild(div);
    });

    function updateVal(i) {
        const val = document.getElementById(`p${i}`).value;
        document.getElementById(`v${i}`).innerText = val;
        currentValues[i] = parseInt(val);
    }

    function setUIValues() {
        currentValues.forEach((val, i) => {
            document.getElementById(`p${i}`).value = val;
            document.getElementById(`v${i}`).innerText = val;
        });
    }

    // Web Serial API 接続
    document.getElementById('connectBtn').addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            document.getElementById('status').innerText = "接続成功";
            startReader();
            getSettings();
        } catch (err) {
            document.getElementById('status').innerText = "接続エラー: " + err;
        }
    });

    async function sendCommand(cmd) {
        if (!port) return;
        const textEncoder = new TextEncoder();
        writer = port.writable.getWriter();
        await writer.write(textEncoder.encode(cmd + "\n"));
        writer.releaseLock();
    }

    async function startReader() {
        keepReading = true;
        const textDecoder = new TextDecoder();
        let buffer = "";
        while (port.readable && keepReading) {
            reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += textDecoder.decode(value, { stream: true });
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); // 最後の不完全な行を保持
                    for (let line of lines) {
                        line = line.trim();
                        handleIncomingLine(line);
                    }
                }
            } catch (error) {
                console.error(error);
            } finally {
                reader.releaseLock();
            }
        }
    }

    const historyData = [[], [], [], []];
    const maxHistory = 100;

    function handleIncomingLine(line) {
        if (line.startsWith("RAW:")) {
            const parts = line.substring(4).split(',');
            if (parts.length === 4) {
                for (let i = 0; i < 4; i++) {
                    historyData[i].push(parseInt(parts[i]) || 0);
                    if (historyData[i].length > maxHistory) historyData[i].shift();
                }
                drawWaveform();
            }
        } else if (line.includes(":")) {
            const parts = line.split(':');
            const idx = parseInt(parts[0]);
            const val = parseInt(parts[1]);
            if (!isNaN(idx) && !isNaN(val) && idx >= 0 && idx < 12) {
                currentValues[idx] = val;
                setUIValues();
            }
        }
        const stat = document.getElementById('status');
        stat.innerText += "\n" + line;
        stat.scrollTop = stat.scrollHeight;
    }

    document.getElementById('getBtn').addEventListener('click', () => getSettings());
    function getSettings() { sendCommand("GETS"); }

    document.getElementById('saveBtn').addEventListener('click', () => sendCommand("SAVE"));

    document.getElementById('sendBtn').addEventListener('click', () => {
        let cmd = "SENS:";
        currentValues.forEach((v, i) => {
            cmd += `${i}=${v}:`;
        });
        sendCommand(cmd);
    });

    document.getElementById('rawBtn').addEventListener('click', () => {
        rawActive = !rawActive;
        sendCommand(rawActive ? "RAWON" : "RAWOFF");
    });

    // キャンバス描画
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    const colors = ['#4caf50', '#2196f3', '#f44336', '#ffeb3b'];

    function drawWaveform() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;
        const dx = w / maxHistory;

        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.strokeStyle = colors[i];
            ctx.lineWidth = 2;
            const data = historyData[i];
            for (let t = 0; t < data.length; t++) {
                const x = t * dx;
                // デルタ値のスケール調整（上下中央基準、最大±300想定）
                const y = (h / 2) - (data[t] * 0.5);
                if (t === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
    }
</script>

</body>
</html>
